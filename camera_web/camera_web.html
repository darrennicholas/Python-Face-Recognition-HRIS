<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        HR Attendance Camera
    </title>

    <link
        rel="stylesheet"
        href="/camera_web.css"
    >

</head>


<body>

    <main class="camera-page">

        <div class="camera-wrapper">

        <video
            id="camera"
            autoplay
            playsinline
            muted
        ></video>


        <canvas
            id="overlay"
        ></canvas>


        <div
            id="loading"
            class="loading"
        >
            Starting camera...
        </div>

        </div>


        <section
            class="camera-status"
            aria-label="Camera recognition status"
        >

            <div class="status-item">
            <small class="label">
                STATUS
            </small>

            <strong id="status">
                Starting...
            </strong>
            </div>


            <div class="status-item">
            <small class="label">
                IDENTITY
            </small>

            <strong id="identity">
                Unknown
            </strong>
            </div>


            <div class="status-item">
            <small class="label">
                SIMILARITY
            </small>

            <strong id="similarity">
                0.0%
            </strong>
            </div>

        </section>

    </main>


    <script
        src="/camera_web.js"
    ></script>

</body>

</html>
